name: Build siri-tts binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build release binary
        run: swift build -c release --disable-sandbox

      - name: Ad-hoc codesign
        run: codesign --force --sign - .build/release/siri-tts

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: siri-tts-macos-arm64
          path: .build/release/siri-tts
          if-no-files-found: error
